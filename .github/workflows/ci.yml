name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11']
        include:
          - os: ubuntu-latest
            python: '3.15'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts tests/guest ksu.py
      - run: python ksu.py --help
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          for script in scripts/build-in-container.sh tests/guest/build-android.sh tests/guest/build-frida-fixtures.sh; do
            bash -n "$script"
          done
          for script in scripts/boot.sh.in scripts/mumu-platform-service.sh scripts/susfs-*.sh* profiles/*/hardening/*.sh; do
            sh -n "$script"
          done
