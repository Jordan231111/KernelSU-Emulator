name: Build MuMu module
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Checked-in compatibility profile ID (candidate builds remain candidates)
        required: true
        default: mumu-pro-1.9.2-arm64
        type: string
      susfs:
        description: Also build this profile's matched SUSFS module
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python ksu.py build --profile "$BUILD_PROFILE" --output out/ci-bundle/core
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
      - run: python ksu.py check-bundle out/ci-bundle/core
      - if: ${{ inputs.susfs }}
        run: python ksu.py build-susfs --profile "$BUILD_PROFILE" --output out/ci-bundle/susfs
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
      - if: ${{ inputs.susfs }}
        run: python ksu.py check-susfs-bundle out/ci-bundle/susfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mumu-profile-bundles
          path: out/ci-bundle/
          if-no-files-found: error
